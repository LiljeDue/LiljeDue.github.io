    <script src="/elm.js"></script>
    <script>
        // Use local URL when debugging (localhost), otherwise use GitHub URL
        var baseContentUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? "http://localhost:8000"
            : "https://raw.githubusercontent.com/LiljeDue/LiljeDue.github.io/refs/heads/main/content";
        
        console.log("Base Content URL:", baseContentUrl);

        var app = Elm.Main.init({
            node: document.getElementById('elm-app'),
            flags: {
                baseContentUrl: baseContentUrl,
                content:  content // This should be defined in content.js
            }
        });
    </script>
