<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Elm with HTML and LaTeX Math</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include MathJax for LaTeX rendering -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div id="elm-app"></div>
    <script src="elm.js"></script>
    <script>
        var app = Elm.Main.init({
            node: document.getElementById('elm-app'),
            flags: {
                baseContentUrl: "https://raw.githubusercontent.com/WilliamDue/WilliamDue.github.io/refs/heads/main",
                content : [
                    "content/blog/main.md"
                ]
            }
        });
    </script>
</body>
</html>
